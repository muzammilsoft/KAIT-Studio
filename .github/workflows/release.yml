name: Release

# Uploads the debug and release APKs to a GitHub release.
#
# Why a workflow, not a local upload: the local GitHub credential is scoped
# to api.github.com only, so uploading release assets from a laptop/VM gets
# 401 from uploads.github.com. The workflow runs on GitHub itself and uses
# the built-in GITHUB_TOKEN, which can upload assets without any stored key.
#
# Two ways to trigger it:
#   - Push a tag like v0.1.2: builds the APKs and creates/updates the
#     release for that tag automatically.
#   - Manually (Actions tab -> Release -> Run workflow): give the tag of an
#     existing release, for example v0.1.1, and the APKs are attached to it.
#     The release body is left untouched.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload APKs to (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run engine parity tests
        run: ./gradlew :engine:test

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Name APKs with the release tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "kait-studio-${TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "kait-studio-${TAG}-release.apk"

      - name: Upload APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            kait-studio-*.apk
          fail_on_unmatched_files: true
